# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "First-year PhD candidate at HKUST NLP Group, researching natural language processing and machine learning."
url: https://BoltBailiffWar.github.io
baseurl: "/LJT-Homepage"
repository: "BoltBailiffWar/LJT-Homepage"

# Site Author (sidebar profile)
author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  location: "Hong Kong"
  employer: "HKUST NLP Group, Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication Categories
publication_category:
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Site Settings
breadcrumbs: false
future: true
read_more: "disabled"
talkmap_link: false

# Social Sharing
twitter:
  username: "junteng88716710"

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Conversion / Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC
encoding: "utf-8"

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - .github
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - node_modules
  - vendor
  - tmp
  - log
  - Dockerfile
  - Gemfile
  - LICENSE
  - README
  - package.json*
  - CHANGELOG
  - Rakefile

atom_feed:
  hide: false

analytics:
  provider: "false"
